<text x="34" y="44" font-size="14" fill="#f0f6fc" font-weight="600" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Forecast plugins</text>
<text x="34" y="66" font-size="12.5" fill="#9198a1" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">tomorrow's likely formats</text>
<text x="34" y="85" font-size="12.5" fill="#9198a1" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">fill-only, gated on strong evidence</text>
<rect x="315" y="20" width="250" height="96" rx="8" fill="#12233a" stroke="#3987e5" stroke-width="1.5"/>
<text x="329" y="44" font-size="14" fill="#f0f6fc" font-weight="600" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Race day</text>
<text x="329" y="66" font-size="12.5" fill="#9198a1" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">misses become pins,</text>
<text x="329" y="85" font-size="12.5" fill="#9198a1" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">then plugins</text>
