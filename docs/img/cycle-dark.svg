<text x="624" y="85" font-size="12.5" fill="#9198a1" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">and submit reply (race/gm.py)</text>
