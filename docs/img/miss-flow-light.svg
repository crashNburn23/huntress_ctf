<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" role="img"><title>How a miss turns into a correct submit</title><defs><marker id="me" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#818b98"/></marker><marker id="se" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,1 L1,5 L10,9 z" fill="#818b98"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#2a78d6"/></marker><marker id="sp" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,1 L1,5 L10,9 z" fill="#2a78d6"/></marker><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#d4561f"/></marker><marker id="sa" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,1 L1,5 L10,9 z" fill="#d4561f"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#c4432b"/></marker><marker id="sb" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,1 L1,5 L10,9 z" fill="#c4432b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#1a7f37"/></marker><marker id="sg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,1 L1,5 L10,9 z" fill="#1a7f37"/></marker></defs><rect x="60.0" y="20" width="300" height="64" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="210" y="47.5" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Build answers</text>
<text x="210" y="66.5" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">lane solver + plugins (pins fill blanks)</text>
<polygon points="210,112.0 320.0,150 210,188.0 100.0,150" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="210" y="155" font-size="13.5" fill="#1f2328" font-weight="600" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Any blank keys?</text>
<rect x="80.0" y="236" width="260" height="56" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="210" y="259.5" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Submit once</text>
<text x="210" y="278.5" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">every key</text>
<polygon points="210,332.0 310.0,370 210,408.0 110.0,370" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="210" y="375" font-size="13.5" fill="#1f2328" font-weight="600" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">CORRECT?</text>
<rect x="100.0" y="476" width="220" height="56" rx="8" fill="#e9f6ec" stroke="#1a7f37" stroke-width="1.5"/>
<text x="210" y="499.5" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Next mode</text>
<text x="210" y="518.5" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">or LANE_DONE</text>
<rect x="485.0" y="112" width="330" height="76" rx="8" fill="#fcefec" stroke="#c4432b" stroke-width="1.5"/>
<text x="650" y="136.0" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Escalate</text>
<text x="650" y="155.0" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">write the brief, status row “escalated”</text>
<text x="650" y="174.0" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">runner parks the mode</text>
<rect x="485.0" y="236" width="330" height="76" rx="8" fill="#fdf0ea" stroke="#d4561f" stroke-width="1.5"/>
<text x="650" y="260.0" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Fixer claims the row</text>
<text x="650" y="279.0" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">pin what it knows (seconds), then a plugin</text>
<text x="650" y="298.0" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">TAKEOVER: hand-solve and pin</text>
<rect x="485.0" y="360" width="330" height="96" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="650" y="384.5" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Hot re-run</text>
<text x="650" y="403.5" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">plugin or pin change detected</text>
<text x="650" y="422.5" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">rebuild OFFLINE from saved members</text>
<text x="650" y="441.5" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">resubmit once to the SAME attempt</text>
<path d="M210,84 L210,110" fill="none" stroke="#818b98" stroke-width="1.6" marker-end="url(#me)"/>
<path d="M320,150 L483,150" fill="none" stroke="#818b98" stroke-width="1.6" marker-end="url(#me)"/>
<text x="402.5" y="140" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-style="italic">yes: no submit</text>
<path d="M210,188 L210,234" fill="none" stroke="#818b98" stroke-width="1.6" marker-end="url(#me)"/>
<text x="220" y="216" font-size="12" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-style="italic">no</text>
<path d="M210,292 L210,330" fill="none" stroke="#818b98" stroke-width="1.6" marker-end="url(#me)"/>
<path d="M210,408 L210,474" fill="none" stroke="#1a7f37" stroke-width="1.6" marker-end="url(#mg)"/>
<text x="220" y="446" font-size="12" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-style="italic">yes</text>
<path d="M310,370 L420,370 L420,176 L483,176" fill="none" stroke="#c4432b" stroke-width="1.6" marker-end="url(#mb)"/>
<text x="430" y="300" font-size="12" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-style="italic">no</text>
<path d="M650,188 L650,234" fill="none" stroke="#818b98" stroke-width="1.6" marker-end="url(#me)"/>
<path d="M650,312 L650,358" fill="none" stroke="#818b98" stroke-width="1.6" marker-end="url(#me)"/>
<path d="M650,456 L650,560 L40,560 L40,370 L108,370" fill="none" stroke="#818b98" stroke-width="1.6" marker-end="url(#me)"/>
<text x="345" y="552" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-style="italic">graded again</text></svg>
