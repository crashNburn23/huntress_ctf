<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 186" width="880" height="186" role="img"><title>Live-target lanes: score the class, rank plugins, recon, run within a request budget</title><defs><marker id="me" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#818b98"/></marker><marker id="se" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,1 L1,5 L10,9 z" fill="#818b98"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#2a78d6"/></marker><marker id="sp" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,1 L1,5 L10,9 z" fill="#2a78d6"/></marker><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#d4561f"/></marker><marker id="sa" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,1 L1,5 L10,9 z" fill="#d4561f"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#c4432b"/></marker><marker id="sb" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,1 L1,5 L10,9 z" fill="#c4432b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#1a7f37"/></marker><marker id="sg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,1 L1,5 L10,9 z" fill="#1a7f37"/></marker></defs><rect x="20.0" y="20" width="186.0" height="104" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="34.0" y="44" font-size="14" fill="#1f2328" font-weight="600" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Score the class</text>
<text x="34.0" y="66" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">from the challenge name,</text>
<text x="34.0" y="85" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">question and prompt,</text>
<text x="34.0" y="104" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">before any request</text>
<path d="M206.0,72.0 L236.0,72.0" fill="none" stroke="#818b98" stroke-width="1.6" marker-end="url(#me)"/>
<rect x="238.0" y="20" width="186.0" height="104" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="252.0" y="44" font-size="14" fill="#1f2328" font-weight="600" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Rank plugins</text>
<text x="252.0" y="66" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">by that score, but</text>
<text x="252.0" y="85" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">never drop one: a wrong</text>
<text x="252.0" y="104" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">guess costs only time</text>
<path d="M424.0,72.0 L454.0,72.0" fill="none" stroke="#818b98" stroke-width="1.6" marker-end="url(#me)"/>
<rect x="456.0" y="20" width="186.0" height="104" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="470.0" y="44" font-size="14" fill="#1f2328" font-weight="600" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Recon</text>
<text x="470.0" y="66" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">a handful of requests;</text>
<text x="470.0" y="85" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">read every response,</text>
<text x="470.0" y="104" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">then re-rank</text>
<path d="M642.0,72.0 L672.0,72.0" fill="none" stroke="#818b98" stroke-width="1.6" marker-end="url(#me)"/>
<rect x="674.0" y="20" width="186.0" height="104" rx="8" fill="#e9f6ec" stroke="#1a7f37" stroke-width="1.5"/>
<text x="688.0" y="44" font-size="14" fill="#1f2328" font-weight="600" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Run</text>
<text x="688.0" y="66" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">today's plugin alone if</text>
<text x="688.0" y="85" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">one exists, otherwise</text>
<text x="688.0" y="104" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">in ranked order</text>
<rect x="20" y="140" width="840" height="40" rx="8" fill="none" stroke="#d1d9e0" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="36" y="165" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Hard request budget per target, with spacing between requests: the assigned target is never hammered.</text></svg>
