<text x="34" y="152" font-size="14" fill="#f0f6fc" font-weight="600" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Members</text>
<text x="34" y="174" font-size="12.5" fill="#9198a1" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">the delivered</text>
