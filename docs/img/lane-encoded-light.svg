<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" role="img"><title>Encoded-text lanes: decode each item with its own day's codec, accept only on a template</title><defs><marker id="me" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#818b98"/></marker><marker id="se" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,1 L1,5 L10,9 z" fill="#818b98"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#2a78d6"/></marker><marker id="sp" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,1 L1,5 L10,9 z" fill="#2a78d6"/></marker><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#d4561f"/></marker><marker id="sa" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,1 L1,5 L10,9 z" fill="#d4561f"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#c4432b"/></marker><marker id="sb" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,1 L1,5 L10,9 z" fill="#c4432b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#1a7f37"/></marker><marker id="sg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,1 L1,5 L10,9 z" fill="#1a7f37"/></marker></defs><rect x="20" y="75" width="190" height="90" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="34" y="99" font-size="14" fill="#1f2328" font-weight="600" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Mastery bundle</text>
<text x="34" y="121" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">one item per earlier day,</text>
<text x="34" y="140" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">each in that day's encoding</text>
<rect x="250" y="20" width="320" height="92" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="264" y="44" font-size="14" fill="#1f2328" font-weight="600" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Earlier days</text>
<text x="264" y="66" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">decode item k with the codec</text>
<text x="264" y="85" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">learned from day k's recording</text>
<rect x="250" y="128" width="320" height="92" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="264" y="152" font-size="14" fill="#1f2328" font-weight="600" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Newest item</text>
<text x="264" y="174" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">new codec: peel base64, hex,</text>
<text x="264" y="193" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">reversal, xor… breadth-first</text>
<rect x="610" y="75" width="250" height="90" rx="8" fill="#e9f6ec" stroke="#1a7f37" stroke-width="1.5"/>
<text x="624" y="99" font-size="14" fill="#1f2328" font-weight="600" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Accept</text>
<text x="624" y="121" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">only when a known</text>
<text x="624" y="140" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">plaintext template appears</text>
<path d="M210,120 L230,120 L230,66 L248,66" fill="none" stroke="#818b98" stroke-width="1.6" marker-end="url(#me)"/>
<path d="M570,66 L590,66 L590,120 L608,120" fill="none" stroke="#818b98" stroke-width="1.6" marker-end="url(#me)"/>
<path d="M210,120 L230,120 L230,174 L248,174" fill="none" stroke="#818b98" stroke-width="1.6" marker-end="url(#me)"/>
<path d="M570,174 L590,174 L590,120 L608,120" fill="none" stroke="#818b98" stroke-width="1.6" marker-end="url(#me)"/>
<rect x="20" y="238" width="840" height="40" rx="8" fill="none" stroke="#d1d9e0" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="36" y="263" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Each item gets a small time budget, so one hard item can't stall the mode.</text></svg>
